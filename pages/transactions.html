<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpendWise — Transactions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/transactions.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="app-header">
      <button class="icon-btn" aria-label="Go back">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 class="app-title">Transactions</h1>
      <button class="icon-btn" aria-label="Notifications">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="badge"></span>
      </button>
    </header>

    <main class="content">
      <!-- Search -->
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="text" id="searchInput" placeholder="Search transactions..." aria-label="Search transactions" />
      </div>

      <!-- Filter Tabs -->
      <div class="tabs" role="tablist" aria-label="Filter transactions">
        <button class="tab active" data-filter="all" role="tab" aria-selected="true">All</button>
        <button class="tab" data-filter="income" role="tab" aria-selected="false">Income</button>
        <button class="tab" data-filter="expense" role="tab" aria-selected="false">Expense</button>
      </div>

      <!-- Transaction list -->
      <div class="tx-list" id="txList"></div>
      <p class="empty" id="emptyState" hidden>No transactions found.</p>
    </main>

    <!-- Footer Navigation -->
    <nav class="bottom-nav" aria-label="Primary">
      <a href="#" class="nav-item active">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 9.5 12 3l9 6.5V21H3V9.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>Home</span>
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 6h16v12H4zM4 10h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>Budget</span>
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Reports</span>
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        <span>More</span>
      </a>
    </nav>
  </div>

  <script src="../js/transactions.js"></script>
</body>
</html>
