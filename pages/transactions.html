        <a href="savings.html" class="nav-link">

    <div class="main-column">

        </button>
        <div class="topbar__greeting">
          <p class="greeting-eyebrow">Transactions</p>
          <h1 class="greeting-name">Mariam <span aria-hidden="true">💼</span></h1>
        </div>
        <div class="topbar__actions">
          <div class="currency-pill" title="Your main currency"><span>NGN (₦)</span></div>
          <a href="reminder.html" class="icon-btn" aria-label="Open reminders">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 3a5 5 0 00-5 5v3.2c0 .8-.3 1.6-.9 2.2L5 14.7c-.6.6-.2 1.7.7 1.7h12.6c.9 0 1.3-1.1.7-1.7l-1.1-1.3a3.2 3.2 0 01-.9-2.2V8a5 5 0 00-5-5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9.5 19a2.5 2.5 0 005 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>

      </header>
      <main id="main-content" class="page">
        <section class="page-heading">
          <div>
            <p class="eyebrow">Your activity</p>
            <h2>Transactions</h2>
            <p>View the incomes and expenses you've added from the dashboard.</p>
          </div>
        </section>

        <section class="card" style="margin-top:16px;">
          <div class="card__header" style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;">
            <div>
              <h2>Transaction list</h2>
            </div>
            <div class="tabs" role="tablist" aria-label="Filter transactions">
              <button class="tab is-active" type="button" data-filter="all" aria-selected="true">All</button>
              <button class="tab" type="button" data-filter="income" aria-selected="false">Income</button>
              <button class="tab" type="button" data-filter="expense" aria-selected="false">Expense</button>
            </div>
          </div>
          <ul id="txList" class="transaction-list"></ul>
          <div style="display:flex;justify-content:flex-end;margin-top:12px;">
            <button id="deleteSelectedBtn" class="btn btn--danger" type="button" disabled style="padding:8px 14px;font-size:0.92rem;">Delete selected</button>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const txListEl = document.getElementById('txList');
      const tabs = Array.from(document.querySelectorAll('.tab'));
      let currentFilter = 'all';

      function formatMoney(amount, currency) {
        const symbol = SpendWise.getCurrencySymbol(currency || SpendWise.getCurrency());
        return symbol + Number(amount).toLocaleString('en-US', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
      }

      function buildTxItem(tx) {
        const sign = tx.type === 'income' ? '+ ' : '- ';
        const amountClass = tx.type === 'income' ? 'is-income' : 'is-expense';
        const icon = tx.type === 'income' ? '💰' : '🛒';

        const li = document.createElement('li');
        li.className = 'tx-item';
        li.dataset.id = tx.id || '';
        li.innerHTML =
          '<label style="display:flex;align-items:center;gap:12px;cursor:pointer;">' +
            '<input type="checkbox" class="tx-select" data-id="' + (tx.id || '') + '" aria-label="Select transaction" />' +
            '<span class="tx-item__icon" style="background:' + (tx.type === 'income' ? 'rgba(34,197,94,0.14)' : 'rgba(239,68,68,0.10)') + '">' + icon + '</span>' +
            '<span class="tx-item__body">' +
              '<span class="tx-item__name">' + tx.category + '</span><br>' +
              '<span class="tx-item__meta">' + tx.date + '</span>' +
            '</span>' +
          '</label>' +
          '<span class="tx-item__amount ' + amountClass + '">' + sign + formatMoney(tx.amount, tx.currency) + '</span>';
        return li;
      }

      const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
      const selectedTransactionIds = new Set();

      function updateDeleteButton() {
        if (!deleteSelectedBtn) return;
        deleteSelectedBtn.disabled = selectedTransactionIds.size === 0;
        deleteSelectedBtn.textContent = selectedTransactionIds.size > 0 ? 'Delete selected (' + selectedTransactionIds.size + ')' : 'Delete selected';
      }

      function renderTransactions() {
        txListEl.innerHTML = '';
        const transactions = SpendWise.getTransactions() || [];

        // Assign IDs to any transactions that lack one for selection/deletion.
        let changed = false;
        transactions.forEach(function (tx, index) {
          if (!tx.id) {
            tx.id = 'tx-' + Date.now() + '-' + index;
            changed = true;
          }
        });
        if (changed) {
          SpendWise.saveTransactions(transactions);
        }

        const visible = transactions.filter(function (tx) {
          return currentFilter === 'all' || tx.type === currentFilter;
        });

        if (visible.length === 0) {
          const empty = document.createElement('li');
          empty.className = 'tx-item';
          empty.innerHTML = '<span class="tx-item__body"><span class="tx-item__name">No transactions yet</span><br><span class="tx-item__meta">Add income or expenses from the dashboard.</span></span>';
          txListEl.appendChild(empty);
          return;
        }

        visible.forEach(function (tx) {
          txListEl.appendChild(buildTxItem(tx));
        });
        updateDeleteButton();
      }

      function removeSelectedTransactions() {
        const transactions = SpendWise.getTransactions() || [];
        const remaining = transactions.filter(function (tx) {
          return !selectedTransactionIds.has(tx.id);
        });
        SpendWise.saveTransactions(remaining);
        selectedTransactionIds.clear();
        renderTransactions();
      }

      txListEl.addEventListener('change', function (event) {
        const checkbox = event.target.closest('.tx-select');
        if (!checkbox) return;
        const id = checkbox.dataset.id;
        if (!id) return;
        if (checkbox.checked) {
          selectedTransactionIds.add(id);
        } else {
          selectedTransactionIds.delete(id);
        }
        updateDeleteButton();
      });

      if (deleteSelectedBtn) {
        deleteSelectedBtn.addEventListener('click', function () {
          if (selectedTransactionIds.size === 0) return;
          if (confirm('Delete the selected transactions?')) {
            removeSelectedTransactions();
          }
        });
      }

      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          tabs.forEach(function (t) {
            t.classList.remove('is-active');
            t.setAttribute('aria-selected', 'false');
          });
          tab.classList.add('is-active');
          tab.setAttribute('aria-selected', 'true');
          currentFilter = tab.dataset.filter;
          renderTransactions();
        });
      });

      renderTransactions();
    });
  </script>
</body>
</html>
