<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpendWise · Personal / Business</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/personal_business.css" />
</head>
<body>
  <div class="phone">
    <!-- Header -->
    <header class="app-header">
      <button class="icon-btn" aria-label="Go back">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 class="app-title">Personal / Business</h1>
      <button class="icon-btn" aria-label="Notifications">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="dot"></span>
      </button>
    </header>

    <main class="content"> 
      <section class="card mode-card">
        <p class="section-label">Current Mode</p>

        <div class="mode-toggle" role="group" aria-label="Select account mode">
          <button class="mode-btn active" id="personalBtn" data-mode="personal" aria-pressed="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Personal
          </button>
          <button class="mode-btn" id="businessBtn" data-mode="business" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
            Business
          </button>
        </div>
      </section>

      <section class="card illustration-card">
        <div class="illustration" id="illustration">
          <!-- Personal illustration (wallet) -->
          <svg class="illo-personal" viewBox="0 0 200 160" width="180" height="150" aria-hidden="true">
            <rect x="30" y="45" width="140" height="95" rx="16" fill="#16A34A"/>
            <rect x="30" y="45" width="140" height="95" rx="16" fill="#22C55E" opacity="0.9"/>
            <rect x="42" y="30" width="105" height="40" rx="10" fill="#F1F5F9"/>
            <rect x="42" y="30" width="105" height="18" rx="9" fill="#3882F6" opacity="0.85"/>
            <circle cx="150" cy="92" r="14" fill="#F1F5F9"/>
            <circle cx="150" cy="92" r="6" fill="#F59E0B"/>
            <rect x="52" y="108" width="60" height="8" rx="4" fill="#F1F5F9" opacity="0.6"/>
          </svg>
          <!-- Business illustration (briefcase) -->
          <svg class="illo-business" viewBox="0 0 200 160" width="180" height="150" aria-hidden="true">
            <rect x="30" y="55" width="140" height="80" rx="14" fill="#16A34A"/>
            <rect x="30" y="55" width="140" height="80" rx="14" fill="#22C55E" opacity="0.92"/>
            <rect x="70" y="35" width="60" height="26" rx="8" fill="none" stroke="#64748B" stroke-width="6"/>
            <rect x="30" y="82" width="140" height="14" fill="#16A34A"/>
            <rect x="88" y="78" width="24" height="22" rx="5" fill="#F59E0B"/>
            <circle cx="100" cy="89" r="4" fill="#F1F5F9"/>
          </svg>
        </div>

        <p class="illo-text">
          Track your personal or business finances separately and stay organized.
        </p>
      </section>
    </main>

    <!-- Footer nav -->
    <nav class="bottom-nav" aria-label="Primary">
      <a href="#" class="nav-item active">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
        <span>Home</span>
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="8"/><rect x="12" y="6" width="3" height="12"/><rect x="17" y="13" width="3" height="5"/></svg>
        <span>Budget</span>
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        <span>Reports</span>
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
        <span>More</span>
      </a>
    </nav>
  </div>

  <script src="../css/personal_business.css"></script>
</body>
</html>
